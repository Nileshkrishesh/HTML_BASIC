<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>
</head>
<body>
    <!-- <table>  creating table format -->
    <table>
     <thead>
         <caption>STUDENT MARKS </caption> <!-- this is for telling which table is this -->
        <tr> <!-- <tr> stands for table row -->
            <th>Subject</th>  <!-- <th>  stands for table header -->
            <th>Marks Obtained</th>
            <th>Total Marks</th>
        
        </tr>
        <!--if want to only one th for all three coloumn then-->
     <th colspan="3">INFORMATION</th><!--colspan="3"mean kitte pe heading lgani hai-->
      </thead>
      <tbody>
        <tr>
            <td>Mathematics</td>  <!-- <td> stands for table data -->
            <td>95</td>
            <td>100</td>
        </tr>

     
        <tr>
            <td>Science</td>
            <td>90</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Social Science</td>
            <td>88</td>
            <td>100</td>
        </tr>
        <tr>
            <td>English</td>
            <td>92</td>
            <td>100</td>
        </tr> 
      </tbody>
</body>
</html>
